<style>
:root{--bg:#0a0810;--ink:#f3ecdd;--mut:#c4bdd3;--gold:#d6b264;--gold2:#f2dca0;--line:rgba(255,255,255,.18);--glass:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Shared Sifaka.Live navigation CSS, copied from styles/app.css and scoped to this header. */
:root{--surface:#1d232b;--surface2:#252d37;--surface3:#2f3945;--border:#384454;--border2:#445365;--accent:#f7931a;--accent-glow:rgba(247,147,26,.24);--live:#ff4f6f;--zap:#f7931a;--zap-dim:rgba(247,147,26,.15);--text:#edf2f7;--text2:#b3c0cf;--muted:#76879a;--green:#16c784;--purple:#8f5bff;--nip05:#8f5bff;--font-display:'DM Sans',sans-serif;}
/* ======== NAV ======== */
.chess-site-nav{
  display:flex;align-items:center;gap:.6rem;
  height:68px;padding:0 1.25rem;
  background:rgba(22,26,31,.97);
  border-bottom:1px solid var(--border);
  position:fixed;top:0;left:0;right:0;z-index:500;
  backdrop-filter:blur(16px);
}
.chess-site-nav .btn{
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:.01em;
}


/* Logo with JS-controlled dropdown */
.chess-site-nav .logo-wrap{position:relative;flex-shrink:0;}
.chess-site-nav .logo{
  font-family:'DM Mono',monospace;font-weight:800;font-size:1rem;
  letter-spacing:.02em;display:flex;align-items:center;gap:.55rem;
  color:var(--text);cursor:pointer;padding:.3rem .55rem;
  border-radius:10px;transition:background .15s;user-select:none;
  background:none;border:none;
}
.chess-site-nav .logo:hover{background:var(--surface2);}
.chess-site-nav .logo.dd-open{background:var(--surface2);}
.chess-site-nav .logo-bolt{color:var(--zap);}
.chess-site-nav .logo-text-8bit{
  font-family:"Press Start 2P","VT323","DM Mono",monospace;
  font-size:.8rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  line-height:1;
  text-shadow:0 0 0 #000, 1px 1px 0 rgba(0,0,0,.35);
}
.chess-site-nav .logo-live-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#c42121;
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
  border-radius:4px;
  padding:.18rem .44rem;
  font-family:"Press Start 2P","VT323","DM Mono",monospace;
  font-size:.62rem;
  letter-spacing:.1em;
  line-height:1;
  box-shadow:0 0 0 1px rgba(0,0,0,.28) inset;
}

/* Shared dropdown style */
.chess-site-nav .nav-dropdown{
  position:absolute;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:12px;padding:.5rem;
  box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03);
  opacity:0;pointer-events:none;
  transform:translateY(-4px);
  transition:opacity .16s ease, transform .16s ease;
  z-index:600;
  min-width:190px;
}
.chess-site-nav .nav-dropdown.open{
  opacity:1;pointer-events:all;transform:translateY(0);
}
.chess-site-nav #logoDropdown{ top:calc(100% + 6px); left:0; }
.chess-site-nav #profileDropdown{ top:calc(100% + 6px); right:0; min-width:210px; }

.chess-site-nav .dd-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.58rem .85rem;border-radius:8px;
  font-size:.83rem;color:var(--text2);cursor:pointer;
  transition:background .1s;background:none;border:none;width:100%;text-align:left;font-family:var(--font-display);font-weight:650;letter-spacing:.01em;
}
.chess-site-nav .dd-item:hover{background:var(--surface2);color:var(--text);}
.chess-site-nav .ddi{font-size:1rem;width:1.2rem;text-align:center;flex-shrink:0;}
.chess-site-nav .dd-count{margin-left:auto;font-family:'DM Mono',monospace;font-size:.65rem;color:var(--live);}
.chess-site-nav .dd-sep{height:1px;background:var(--border);margin:.3rem 0;}

/* Search */

function submitSearch(){const q=search.value.trim();if(!q)return;try{sessionStorage.setItem('sifaka_chess_pending_search',q);}catch(_){}window.location.href='/?search='+encodeURIComponent(q);}
search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitSearch();}});
search.addEventListener('input',()=>{const q=search.value.trim();results.classList.toggle('open',!!q);if(q){const t=results.querySelector('.sr-title'),s=results.querySelector('.sr-sub');if(t)t.textContent='Search for “'+q.slice(0,80)+'”';if(s)s.textContent='Press Enter to view results';}});
$('chessSearchSubmit').addEventListener('click',submitSearch);$('chessSearchSubmit').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();submitSearch();}});
document.addEventListener('click',e=>{if(!e.target.closest('.chess-site-nav .search-wrap'))results.classList.remove('open');});
const pk=stored();if(pk){try{localStorage.setItem(STORE,pk);}catch(_){}requestId++;setIdentity(pk,{},false);load(pk,requestId);}else loggedOutState();
window.addEventListener('storage',()=>{const current=stored();if(current&&current!==active){requestId++;setIdentity(current,{},false);load(current,requestId);}});
})();</script>
</body></html>
